<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ac6757" />
  <meta name="app-version" content="5.1-reg-list-orange" />
  <title>桃園市私立劉信子居家長照機構｜內部管理系統</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#f7f4f3;color:#1f2937}
    .boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .boot-mark{width:56px;height:56px;margin:0 auto 16px;border-radius:16px;background:#ac6757;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:800}
    .boot p{color:#6b7280;margin:8px 0 0}
    .boot-error{max-width:620px;background:#fff;border:1px solid #eadfdc;border-radius:16px;padding:24px}
  </style>
</head>
<body>
  <div id="boot" class="boot"><div><div class="boot-mark">信</div><strong>劉信子居家長照機構</strong><p>正在載入內部管理系統…</p></div></div>
  <script>
    (async()=>{
      const files=[
        'v51/part01.txt','v51/part02.txt','v51/part03.txt','v51/part04.txt',
        'v51/part05.txt','v51/part06.txt','v51/part07.txt'
      ];
      try{
        const parts=[];
        for(const file of files){
          const res=await fetch(file,{cache:'no-store'});
          if(!res.ok) throw new Error(`${file} 載入失敗（${res.status}）`);
          parts.push(await res.text());
        }
        const patchRes=await fetch('v51/regulations-list-patch.txt',{cache:'no-store'});
        if(!patchRes.ok) throw new Error(`v51/regulations-list-patch.txt 載入失敗（${patchRes.status}）`);
        const regulationsPatch=await patchRes.text();

        const compactCSS=`<style id="v51-compact-density">
          :root{
            --green-900:#704238!important;
            --green-800:#8c4a3c!important;
            --green-700:#ac6757!important;
            --green-600:#bf745f!important;
            --green-100:#f5e2dd!important;
            --green-050:#fcf6f4!important;
            --line:#eadfdc!important;
            --bg:#f7f4f3!important;
          }
          html,body{background:#f7f4f3!important}
          .login-shell{background:linear-gradient(135deg,#f8ece8 0%,#fbf6f4 48%,#fff 100%)!important}
          .login-brand:before,.login-brand:after{background:rgba(219,146,119,.10)!important}
          .brand-mark{background:linear-gradient(145deg,#ac6757,#704238)!important;box-shadow:0 14px 30px rgba(172,103,87,.20)!important}
          .brand-sub{color:#ac6757!important}
          .login-copy h1{color:#6f4136!important}
          .login-copy p{color:#6f5a54!important}
          .login-pill{border-color:rgba(172,103,87,.16)!important;color:#7c5147!important}
          .login-note{background:#fcf8f6!important;color:#806960!important}
          .sidebar{background:#704238!important;padding:14px 12px!important}
          .side-brand{gap:10px!important;padding:3px 7px 14px!important;border-bottom-color:rgba(255,255,255,.12)!important}
          .side-brand .brand-mark{width:38px!important;height:38px!important;border-radius:11px!important;font-size:18px!important;background:#ac6757!important}
          .side-brand strong{font-size:13.5px!important;line-height:1.3!important}
          .side-brand span{font-size:11px!important;margin-top:2px!important;color:#e5c6ba!important}
          .nav{padding-top:9px!important;scrollbar-color:rgba(255,255,255,.22) transparent!important}
          .nav-section{padding:8px 9px 4px!important;font-size:10px!important;letter-spacing:.1em!important;color:#d6a797!important}
          .nav-btn{gap:9px!important;padding:8px 10px!important;border-radius:9px!important;margin:1px 0!important;font-size:13px!important;min-height:38px!important;color:#f3e5e0!important}
          .nav-btn:hover{background:rgba(255,255,255,.08)!important;color:#fff!important}
          .nav-btn.active{background:#9a5848!important;color:#fff!important;box-shadow:inset 3px 0 0 #e6b6a5!important}
          .nav-icon{width:20px!important;font-size:15px!important}
          .nav-badge{color:#9a5848!important}
          .side-foot{color:#d6aaa0!important;border-top-color:rgba(255,255,255,.12)!important}
          .topbar{height:64px!important;padding:0 24px!important}
          .content{padding:18px 24px 30px!important}
          .welcome{gap:16px!important;margin-bottom:14px!important}
          .welcome h1{font-size:25px!important;margin-bottom:4px!important}
          .welcome p{font-size:13px!important}
          .phase-pill{background:#f5e2dd!important;color:#8c4a3c!important;border-color:#e8c5ba!important}
          .stats{gap:10px!important;margin-bottom:14px!important}
          .stat-card{border-radius:14px!important;padding:13px 14px!important}
          .stat-head{font-size:12px!important}
          .stat-icon{width:30px!important;height:30px!important;border-radius:9px!important;font-size:13px!important;background:#fcf6f4!important}
          .stat-value{font-size:25px!important;margin-top:7px!important;line-height:1.1!important}
          .stat-foot{font-size:11px!important;margin-top:4px!important}
          .stat-foot.live{color:#ac6757!important}
          .grid-2{gap:12px!important;margin-bottom:12px!important}
          .panel{border-radius:14px!important}
          .panel-head{padding:12px 14px!important;gap:10px!important}
          .panel-head h3{font-size:15px!important}
          .panel-head small{font-size:11px!important}
          .panel-body{padding:12px 14px!important}
          .panel-body .empty[style]{padding:20px 14px!important}
          .empty{padding:22px 14px!important}
          .empty .icon{margin-bottom:8px!important}
          .empty .icon[style]{font-size:24px!important}
          .empty h3{font-size:15px!important;margin:6px 0!important}
          .empty p{font-size:11.5px!important;line-height:1.5!important;margin-top:4px!important}
          .task{border-radius:10px!important;padding:10px 11px!important;gap:9px!important}
          .task-title{font-size:13px!important}
          .task-desc{font-size:11px!important;margin-top:3px!important;line-height:1.45!important}
          .task-dot.green{background:#ac6757!important}
          .tag.live{background:#f5e2dd!important;color:#8c4a3c!important}
          .module-grid{gap:9px!important}
          .module-card{border-radius:11px!important;padding:11px 12px!important}
          .module-card .mi{font-size:18px!important}
          .module-card strong{margin-top:7px!important;font-size:13px!important}
          .module-card span{font-size:10.5px!important;margin-top:3px!important}
          .module-card .ready{color:#ac6757!important}
          .reg-mini{gap:7px!important}
          .reg-mini-item{padding:9px 10px!important;border-radius:9px!important}
          .reg-mini-item strong{font-size:12.5px!important}
          .reg-mini-item span{font-size:10.5px!important;margin-top:3px!important}
          .page-head{margin-bottom:12px!important}
          .page-head h1{font-size:23px!important}
          .page-head p{font-size:12px!important;margin-top:4px!important}
          .toolbar{gap:8px!important;margin-bottom:10px!important}
          .btn{padding:8px 11px!important;font-size:12px!important;border-radius:9px!important}
          .btn.sm{padding:6px 9px!important;font-size:11px!important}
          .btn.primary{background:#8c4a3c!important;border-color:#8c4a3c!important;color:#fff!important}
          .btn.primary:hover{background:#704238!important;border-color:#704238!important}
          .google-btn:hover{border-color:#d6a797!important;background:#fffaf8!important}
          .searchbox input:focus,select:focus,input:focus,textarea:focus{border-color:#d6a797!important;box-shadow:0 0 0 3px rgba(219,146,119,.16)!important}
          .reg-grid{gap:10px!important}
          .reg-card{border-radius:12px!important;padding:13px 14px!important;min-height:165px!important}
          .reg-cat{color:#9a5848!important;background:#fcf6f4!important}
          .status.published{background:#f5e2dd!important;color:#8c4a3c!important}
          .build-hero .bigicon{background:#f5e2dd!important}
          .build-item:before{color:#ac6757!important}
          .avatar{background:#f5e2dd!important;color:#8c4a3c!important}
          .spinner{border-color:#f0ddd7!important;border-top-color:#ac6757!important}
          @media(max-width:820px){.content{padding:16px 14px 28px!important}.topbar{padding:0 10px!important}}
          @media(max-width:560px){.stat-card{padding:11px 12px!important}.nav-btn{min-height:40px!important}}
        </style>`;
        let html=parts.join('').replace('</head>',compactCSS+'</head>');
        const initMarker='\n  init();\n})();';
        if(!html.includes(initMarker)) throw new Error('V5.1 內規模組插入點不存在');
        html=html.replace(initMarker,'\n'+regulationsPatch+'\n  init();\n})();');
        document.open();
        document.write(html);
        document.close();
      }catch(err){
        console.error(err);
        document.getElementById('boot').innerHTML=`<div class="boot-error"><div class="boot-mark">信</div><h2>系統載入失敗</h2><p>${String(err.message||err)}</p><p>請重新整理頁面；若仍無法開啟，請聯絡系統管理者。</p></div>`;
      }
    })();
  </script>
</body>
</html>
