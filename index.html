<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f6b4f" />
  <meta name="app-version" content="5.1-loader" />
  <title>桃園市私立劉信子居家長照機構｜內部管理系統</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#f4f6f5;color:#1f2937}
    .boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .boot-mark{width:56px;height:56px;margin:0 auto 16px;border-radius:16px;background:#236b50;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:800}
    .boot p{color:#6b7280;margin:8px 0 0}
    .boot-error{max-width:620px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px}
  </style>
</head>
<body>
  <div id="boot" class="boot"><div><div class="boot-mark">信</div><strong>劉信子居家長照機構</strong><p>正在載入內部管理系統…</p></div></div>
  <script>
    (async()=>{
      const files=[
        'v51/part01.txt','v51/part02.txt','v51/part03.txt','v51/part04.txt',
        'v51/part05.txt','v51/part06.txt','v51/part07.txt'
      ];
      try{
        const parts=[];
        for(const file of files){
          const res=await fetch(file,{cache:'no-store'});
          if(!res.ok) throw new Error(`${file} 載入失敗（${res.status}）`);
          parts.push(await res.text());
        }
        const html=parts.join('');
        document.open();
        document.write(html);
        document.close();
      }catch(err){
        console.error(err);
        document.getElementById('boot').innerHTML=`<div class="boot-error"><div class="boot-mark">信</div><h2>系統載入失敗</h2><p>${String(err.message||err)}</p><p>請重新整理頁面；若仍無法開啟，請聯絡系統管理者。</p></div>`;
      }
    })();
  </script>
</body>
</html>
